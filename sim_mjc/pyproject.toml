[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sim_mjc"
version = "0.1.0"
description = "Modular MuJoCo quadrotor simulation environment for control research"
requires-python = ">=3.9"
dependencies = ["mujoco>=3.0", "numpy>=1.23", "scipy>=1.9"]

[project.optional-dependencies]
mpc  = ["cvxpy>=1.3"]
rl   = ["torch>=2.0", "gymnasium>=0.29"]
viz  = ["matplotlib>=3.6", "mediapy>=1.1"]
all  = ["cvxpy>=1.3", "torch>=2.0", "gymnasium>=0.29", "matplotlib>=3.6", "mediapy>=1.1"]
test = ["pytest>=7"]

[project.scripts]
sim-mjc = "sim_mjc.cli:main"

[tool.setuptools.packages.find]
include = ["sim_mjc*"]

[tool.setuptools.package-data]
sim_mjc = ["assets/*"]
